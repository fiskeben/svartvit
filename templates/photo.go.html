{{define "photo"}}
<article class="photo{{if .Disabled}} disabled{{end}}">
    <a href="{{.Path}}" target="_blank" class="plate">
        <div class="halftone"><img src="{{.Path}}" alt="{{.Name}}" loading="lazy" /></div>
        {{if .Disabled}}<span class="stamp">Paused</span>{{end}}
    </a>
    <h2 class="caption">{{.Name}}</h2>
    <div class="actions">
        <div>
            <button hx-put="/photo/{{.Id}}/set" hx-target="next .output" hx-swap="innerHTML">Show on frame</button>
            <a href="/photo/{{.Id}}/preview" target="_blank" class="button">Preview</a>
        </div>
        <div>
            <button hx-get="/photo/{{.Id}}/edit" hx-target="closest .photo" hx-swap="outerHTML">Edit</button>
            <button hx-put="/photo/{{.Id}}/toggle" hx-target="closest .photo" hx-swap="outerHTML">{{if .Disabled}}Resume{{else}}Pause{{end}}</button>
            <button hx-delete="/photo/{{.Id}}" hx-target="closest .photo" hx-swap="outerHTML" hx-confirm="Delete {{.Name}}?" class="danger">Delete</button>
        </div>
    </div>
    <div class="output"></div>
</article>
{{end}}
