<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <style>
        body {
            padding: 1em 0 2em 0;
            font-family: Helvetica Arial, sans-serif;
            font-size: 16px;
        }

        #main {
            max-width: 80rem;
            margin: 0 auto;
        }

        header {
            border-bottom: 1rem solid #d0d0d0;
        }

        header h1 {
            margin-bottom: -0.43rem;
        }

        footer {
            font-size: 68%;
            margin-top: 2rem;
            padding-top: 2rem;
            text-align: center;
            border-top: 1px solid #d0d0d0;
        }

        #upload-frame {
            width: 40rem;
            margin: 1rem auto;
            padding: 1rem;
            border: 1px solid #f0f0f0;
        }

        #photos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .photo {
            margin: 1rem;
            padding: 1rem;
            border: 1px solid #d0d0f0;
        }

        .disabled {
            filter: grayscale(100%);
            background-color: #fdfdfd;
        }

        .image {
            width: 12rem;
            height: auto;
            border: 1px solid #909090;
        }

        .icons {
            display: flex;
            justify-content: right;
        }

        .icon {
            width: 2rem;
            height: 2rem;
            margin: 0.5rem;
            cursor: pointer;
        }

        .photo form {
            display: flex;
            flex-direction: column;
            font-size: 80%;
        }

        .photo form div {
            margin: 0.2rem 0;
        }

        .photo form input[type="text"] {
            margin: 0.5rem 0;
        }

        .photo form button {
            display: flex;
            align-items: center;
            background: none;
            border: none;
        }

        .photo form .icon {
            margin: 0.5rem;
            cursor: pointer;
        }
    </style>
    <title>SVARTVIT</title>
</head>
<body>
<div id="main">
    <header>
        <h1>SVARTVIT</h1>
    </header>

    <div id="upload-frame">
        <p>Add a new photo to the frame:</p>
        <form id="upload" hx-post="/upload" hx-encoding="multipart/form-data" hx-target="#upload-message">
            <input type="file" name="photo" id="photo" />
            <button type="submit">Upload</button>
            <progress id='progress' value='0' max='100'></progress>
        </form>
        <script>
            htmx.on('#upload', 'htmx:xhr:progress', function(evt) {
                htmx.find('#progress').setAttribute('value', evt.detail.loaded/evt.detail.total * 100)
            });
        </script>
        <div id="upload-message"></div>
    </div>

    <div id="photos">
        {{range .Images}}
            {{ template "photo" . }}
        {{end}}
    </div>

    <footer>
        It's a photo frame!
    </footer>
</div>
</body>
</html>
