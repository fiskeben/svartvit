<article class="photo edit{{if .Disabled}} disabled{{end}}">
    <form hx-put="/photo/{{.Id}}" hx-swap="outerHTML" hx-target="closest .photo">
        <a href="{{.Path}}" target="_blank" class="plate">
            <div class="halftone"><img src="{{.Path}}" alt="{{.Name}}" /></div>
        </a>
        <label class="field">
            Name
            <input type="text" name="name" value="{{.Name}}" autofocus />
        </label>
        <label class="field checkbox">
            <input type="checkbox" name="disabled" value="on" {{if .Disabled}}checked{{end}} />
            Paused
        </label>
        <div class="actions">
            <button type="submit" class="primary">Save</button>
            <button type="button" hx-get="/photo/{{.Id}}" hx-target="closest .photo" hx-swap="outerHTML">Cancel</button>
        </div>
    </form>
</article>
